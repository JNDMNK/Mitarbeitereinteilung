<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a50d26" />
    <title>Keine Verbindung · Einteilung</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 22rem; margin: 1rem; padding: 1.5rem; background: #fff; border-radius: 1rem; box-shadow: 0 4px 16px rgb(0 0 0 / 0.08); text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
      p { color: #475569; line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.4rem; background: #a50d26; color: #fff; border-radius: 0.6rem; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Keine Verbindung</h1>
      <p>Die Einteilung braucht eine Internetverbindung, damit immer der aktuelle Stand angezeigt wird.</p>
      <a href="/">Erneut versuchen</a>
    </main>
  </body>
</html>
